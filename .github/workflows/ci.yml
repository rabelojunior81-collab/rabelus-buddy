# CI do Rabelus Buddy: as regras pétreas conferidas por máquina.
# Actions fixadas por SHA de commit (versões e SHAs verificados em 2026-10-14;
# ficha: docs/20-conhecimento/ci-github-actions.md).
name: CI

# Minutos (2026-10-18): a cota do mês acabou com ~2.095 minutos ponderados (macOS pesa 10, Windows 2).
# Cada combinação roda uma vez, onde agrega; o plano por evento é o `bd ci-plan` (scripts/lib/ciplan.mjs, testado).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1' # segunda-feira, 10:00 em Curitiba: matriz completa, contra deriva
  workflow_dispatch:

permissions:
  contents: read

# Commit novo no mesmo PR cancela a execução anterior (na main, nada se cancela).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regras:
    name: Testes, nomes e nenhuma exclusão
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      codigo: ${{ steps.plano.outputs.codigo }}
      matriz: ${{ steps.plano.outputs.matriz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Plano desta execução (código mudou? qual matriz?)
        id: plano
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          node scripts/bd.mjs ci-plan --event "$EVENT" --base "$base"

      - name: Dependências exatas do lockfile
        run: npm ci --no-audit --no-fund

      - name: Vulnerabilidades na árvore inteira (npm audit, alta ou crítica reprova)
        run: npm audit --audit-level=high

      - name: Testes (Linux, Node 24)
        if: steps.plano.outputs.codigo == 'true'
        run: npm test

      - name: Tipos (tsc --noEmit; SPEC 0001, decisão 8)
        if: steps.plano.outputs.codigo == 'true'
        run: npm run typecheck

      - name: Nomes na convenção
        run: node scripts/bd.mjs names-check

      - name: Nenhum órfão nem link quebrado (regra do Pai, 2026-10-18)
        run: node scripts/bd.mjs orfaos

      - name: Todo commit de código com registro no barramento (autoverificação, regra do Pai, 2026-10-18)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/bd.mjs verifica --registros --base "origin/${BASE_REF}"

      - name: Superfícies coerentes (índices, ADRs, carimbos, STATUS)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/bd.mjs surfaces --base "origin/${BASE_REF:-main}"

      - name: Dependências conforme o protocolo (DEPENDENCIAS.md)
        run: node scripts/bd.mjs deps

      - name: Registro de validações com mecanismos ligados (VALIDACOES.md)
        run: node scripts/bd.mjs validacoes

      - name: Documento vivo só com claim no ledger (AGENTS §2)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/bd.mjs claims --base "origin/${BASE_REF:-main}"

      - name: Testes não se afrouxam (teste reprovado se corrige no código)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/bd.mjs test-guard --base "origin/${BASE_REF:-main}"

      - name: Nenhuma exclusão (regra pétrea, ADR 0004)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            echo "primeiro push: nada a comparar"; exit 0
          fi
          node scripts/bd.mjs guard --base "$base"

  matriz:
    name: Testes e tipos (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: regras
    if: needs.regras.outputs.matriz != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.regras.outputs.matriz) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Dependências exatas do lockfile
        run: npm ci --no-audit --no-fund

      - name: Testes
        run: npm test

      - name: Tipos
        run: npm run typecheck

  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (binário MIT, checksum conferido)
        env:
          V: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" sums.txt | sed "s/gitleaks_${V}_linux_x64.tar.gz$/gitleaks.tgz/" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Varrer todo o histórico
        run: ./gitleaks git --redact --no-banner --verbose .
