<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">

<link rel="icon" href="data:,">
<script id="tema-cedo">try { var rbT = localStorage.getItem('rb.theme'); if (rbT === 'light' || rbT === 'dark') document.documentElement.setAttribute('data-theme', rbT); } catch (e) { /* sem armazenamento: Sistema */ }</script>
<style>
  :root {
    --bg: #0d1113; --panel: #151b1e; --panel2: #1b2327; --line: #263238; --text: #e6eef0; --muted: #8fa3a8;
    --accent: #3fb8a8; --accent-ink: #062a25; --warn: #e0b04a; --bad: #e0675a; --ok: #59c27a; --radius: 10px; color-scheme: dark;
  }
  /* Tema (critério 35): Sistema segue o navegador; Claro e Escuro escolhidos na console valem acima dele. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f4f7f7; --panel: #ffffff; --panel2: #f0f4f4; --line: #d9e2e3; --text: #142024; --muted: #5b6e73; --accent-ink: #ffffff; --accent: #208a7c; color-scheme: light; }
  }
  :root[data-theme="light"] { --bg: #f4f7f7; --panel: #ffffff; --panel2: #f0f4f4; --line: #d9e2e3; --text: #142024; --muted: #5b6e73; --accent-ink: #ffffff; --accent: #208a7c; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px; } header { padding: 10px 12px; flex-wrap: wrap; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  textarea, input, select, button { font: inherit; color: inherit; }
  textarea, input[type=text], input[type=password], select { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  textarea { min-height: 84px; resize: vertical; }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--text); }
  .check input { width: auto; }
  button { cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); padding: 8px 14px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 13px; }
  .msg { font-size: 13px; margin-top: 8px; min-height: 1em; }
  .msg.bad { color: var(--bad); }
  .chat { display: flex; flex-direction: column; height: calc(100vh - 92px); min-height: 460px; margin-bottom: 0; padding: 0; overflow: hidden; }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .chat-head h2 { margin: 0; }
  .chat-head .spacer { flex: 1; }
  #feed { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: auto; padding: 14px 16px; }
  .composer { border-top: 1px solid var(--line); padding: 12px 16px; background: var(--panel); }
  .composer textarea { min-height: 52px; max-height: 220px; }
  .composer .controls { display: flex; gap: 10px; align-items: end; margin-top: 8px; flex-wrap: wrap; }
  .composer .controls > div { flex: 1 1 180px; }
  .composer .controls button { flex: 0 0 auto; height: 40px; }
  .composer details { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .composer details input { margin-top: 6px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  aside { max-height: calc(100vh - 92px); overflow: auto; }
  @media (max-width: 900px) { .chat { height: 78vh; } aside { max-height: none; } }
  .bubble { border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
  .bubble.you { background: var(--panel2); border: 1px solid var(--line); align-self: flex-end; max-width: 85%; }
  .bubble.buddy { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); max-width: 92%; }
  .bubble p { margin: 0 0 8px; } .bubble p.h { margin-top: 10px; font-size: 1.04em; } .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child, .bubble pre:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 22px; white-space: normal; }
  .bubble pre.code { margin: 0 0 8px; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; overflow: auto; white-space: pre; }
  .bubble pre.code code { padding: 0; background: none; }
  .bubble code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .who { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .6px; }
  .ev { font-size: 12.5px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--line); }
  .ev.err { color: var(--bad); border-left-color: var(--bad); }
  .ev.tool { color: var(--text); }
  details.res { font-size: 12.5px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--line); }
  details.res pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0 0; max-height: 200px; overflow: auto; }
  details.grp { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
  details.grp > summary { cursor: pointer; user-select: none; }
  details.grp > .in { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  details.reason pre, .live .reason pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0 0; max-height: 240px; overflow: auto; font-family: inherit; color: var(--muted); }
  .live { display: flex; flex-direction: column; gap: 8px; }
  .live .line { font-size: 12.5px; color: var(--accent); display: flex; gap: 8px; align-items: center; }
  .live .spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: rb-spin .8s linear infinite; }
  @keyframes rb-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .live .spin { animation: none; } }
  .bubble.buddy.typing::after { content: '▍'; color: var(--accent); }
  .queued { align-self: flex-end; max-width: 85%; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
  .queued .who { color: var(--warn); }
  .queued .actions { margin-top: 6px; }
  .tag { font-size: 10.5px; color: var(--warn); margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin: 0; }
  .toggle input { width: auto; margin: 0; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.list li { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 14px; }
  ul.list li .t { overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: var(--ok); } .badge.warn { color: var(--warn); border-color: var(--warn); } .badge.bad { color: var(--bad); border-color: var(--bad); }
  .approval { border: 1px solid var(--warn); border-radius: 8px; padding: 10px; }
  .approval .a { font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
  .bar { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .win { font-size: 13px; }
  .win .n { display: flex; justify-content: space-between; gap: 8px; }
  .runs li { cursor: pointer; }
  .runs li.sel .t { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Rabelus <span>Buddy</span></h1>
  <span class="sub" data-i18n="console.subtitle">Console local</span>
  <span class="spacer"></span>
  <span class="note"><span id="conn" class="dot"></span><span id="connText"></span></span>
  <label for="lang" class="note" style="margin:0" data-i18n="console.lang">Idioma</label>
  <select id="lang" style="width:auto"><option value="pt-BR">pt-BR</option><option value="en">en</option></select>
  <label for="theme" class="note" style="margin:0" data-i18n="console.theme.title">Tema</label>
  <select id="theme" style="width:auto"><option value="system" data-i18n="console.theme.system">Sistema</option><option value="light" data-i18n="console.theme.light">Claro</option><option value="dark" data-i18n="console.theme.dark">Escuro</option></select>
</header>
<main>
  <section class="chat" aria-labelledby="hFeed">
    <div class="chat-head">
      <h2 id="hFeed" data-i18n="console.feed.title">Conversa</h2>

      <label class="toggle" for="detailsToggle"><input id="detailsToggle" type="checkbox"><span data-i18n="console.feed.showDetails">Mostrar raciocínio e ações</span></label>

    </div>
    <div id="feed" aria-live="polite"></div>
    <div class="composer">

      <textarea id="task" data-i18n-placeholder="console.task.placeholder"></textarea>
      <div class="controls">
        <div><label for="effort" data-i18n="console.task.effort">Esforço</label>

            <option value="default" data-i18n="console.effort.default"></option>

        <div><label for="route" data-i18n="console.task.route">Provedor</label><select id="route"></select></div>

      <details><summary data-i18n="console.task.workspace">Pasta de trabalho</summary><input id="workspace" type="text" spellcheck="false" data-i18n-aria="console.task.workspace"></details>
      <div class="hint"><span data-i18n="console.task.hint"></span> <span id="runMsg" class="msg"></span></div>

  </section>
  <aside>
    <section aria-labelledby="hAp"><h2 id="hAp" data-i18n="console.approvals.title">Aprovações</h2><div id="approvals"></div></section>
    <section aria-labelledby="hProv">
      <h2 id="hProv" data-i18n="console.providers.title">Provedores</h2>
      <ul id="providers" class="list"></ul>
      <div style="margin-top:14px">
        <label data-i18n="console.chatgpt.title">ChatGPT</label>
        <div id="chatgptState" class="note"></div>
        <div class="actions"><button id="login" class="primary" data-i18n="console.chatgpt.login">Entrar</button><button id="logout" class="danger" data-i18n="console.chatgpt.logout">Sair</button></div>
        <div id="loginMsg" class="msg"></div>
      </div>
      <div style="margin-top:14px">
        <label data-i18n="console.keys.title">Chaves</label>
        <div class="row" style="margin-top:0">
          <select id="keyProvider" data-i18n-aria="console.keys.provider"><option value="opencode-go">opencode-go</option><option value="ollama-cloud">ollama-cloud</option><option value="openrouter">openrouter</option></select>
          <input id="keyValue" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="console.keys.placeholder">
        </div>
        <div class="actions"><button id="keySave" data-i18n="console.keys.save">Guardar</button><button id="keyRemove" class="danger" data-i18n="console.keys.remove">Remover</button></div>
        <div id="keyMsg" class="msg"></div>
        <p class="note" data-i18n="console.keys.hint"></p>
      </div>
    </section>
    <section aria-labelledby="hBud"><h2 id="hBud" data-i18n="console.budget.title">Consumo</h2><div id="budget"></div><div class="actions"><button id="budgetToggle"></button></div></section>
    <section aria-labelledby="hRuns"><h2 id="hRuns" data-i18n="console.runs.title">Execuções</h2><ul id="runs" class="list runs"></ul></section>
  </aside>
</main>
<script>
'use strict';
const token = new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* sem armazenamento */ } } };
let cat = {};
let lang = store.get('rb.lang', 'pt-BR');
const prefs = restore((k, d) => store.get(k, d));
let session = prefs.session; // sessão aberta na conversa (lembrada ao recarregar)
const groupOpen = new Map();  // grupos abertos ou fechados à mão pelo usuário
let lastRun = null;        // última execução da sessão aberta
let showAll = false;
let routesCfg = [];
let providerState = [];

function t(key, vars) {
  let s = key.split('.').reduce((o, p) => (o && typeof o === 'object' ? o[p] : undefined), cat);
  if (typeof s !== 'string') return key;
  for (const [k, v] of Object.entries(vars || {})) s = s.split('{{' + k + '}}').join(String(v));
  return s;
}
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids) if (k !== null && k !== undefined) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
// <puras> (sem DOM; o teste avalia este trecho)
// Blocos da resposta: parágrafo, lista e bloco de código cercado por ```.
function mdBlocks(text) {
  const out = [];
  const lines = String(text).replace(/\r\n/g, '\n').split('\n');
  let para = [];
  const flush = () => { if (para.length) out.push({ type: 'p', text: para.join('\n') }); para = []; };
  for (let i = 0; i < lines.length; i++) {
    const fence = /^\s*```\s*([\w+-]*)\s*$/.exec(lines[i]);
    if (fence) {
      flush();
      const body = [];
      for (i++; i < lines.length && !/^\s*```\s*$/.test(lines[i]); i++) body.push(lines[i]);
      out.push({ type: 'code', lang: fence[1], text: body.join('\n') });
      continue;
    }
    const head = /^\s*#{1,6}\s+(.+?)\s*#*\s*$/.exec(lines[i]);
    if (head) {
      flush();
      for (const b of out) delete b.open;
      out.push({ type: 'h', text: head[1] });
      continue;
    }
    const item = /^\s*(?:([-*])|(\d+)[.)])\s+(.*)$/.exec(lines[i]);
    if (item) {
      flush();
      const ordered = !item[1];
      const last = out[out.length - 1];
      if (last && last.type === 'list' && last.ordered === ordered && last.open) last.items.push(item[3]);
      else out.push({ type: 'list', ordered, items: [item[3]], open: true });
      continue;
    }
    for (const b of out) delete b.open;
    if (lines[i].trim() === '') flush(); else para.push(lines[i]);
  }
  flush();
  for (const b of out) delete b.open;
  return out;
}
// Estado do login do ChatGPT: conectado, o botão principal deixa de ser "Entrar".
function authView(a, t) {
  let text = t('console.chatgpt.out');
  if (a.pending) text = t('console.chatgpt.pending');
  else if (a.loggedIn) text = t('console.chatgpt.connected', { who: a.email || '—' }) + ' · ' + t(a.planEnabled ? 'console.chatgpt.planYes' : 'console.chatgpt.planNo');
  else if (a.error) text = t('console.chatgpt.error', { code: a.error });
  return { text, loginKey: a.loggedIn ? 'console.chatgpt.switch' : 'console.chatgpt.login', loginPrimary: !a.loggedIn, logoutEnabled: !!(a.loggedIn || a.pending) };
}
// Memória da página (critério 34): conversa aberta e preferência de detalhes; armazenamento bloqueado não quebra nada.
function restore(get) {
  try { return { session: get('rb.session', null) || null, details: get('rb.details', 'closed') === 'open', route: get('rb.route', '') || '', theme: get('rb.theme', 'system') || 'system' }; }
  catch { return { session: null, details: false, route: '', theme: 'system' }; }
}
// Tema (critério 35): Sistema não marca a página (vale o prefers-color-scheme); Claro e Escuro marcam.
function themeOf(choice) { return choice === 'light' || choice === 'dark' ? choice : null; }
function elapsedText(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s';
}
// Cadência do texto ao vivo: cerca de 60 caracteres por segundo, acelerando com o atraso para nunca ficar
// mais de ~1,5 s atrás do que já chegou; o fim (uma palavra) sai de uma vez.
function revealStep(shown, total, dtMs) {
  const behind = total - shown;
  if (behind <= 12) return total;
  const rate = Math.max(60, behind / 1.5);
  return Math.min(total, shown + Math.max(1, Math.ceil((rate * dtMs) / 1000)));
}
function liveLine(l, ms, t) {
  const phase = l.phase === 'tool' ? t('console.live.tool', { tool: l.tool || '?' }) : l.phase === 'writing' ? t('console.live.writing') : l.phase === 'approval' ? t('console.live.approval') : t('console.live.thinking');
  return [phase, elapsedText(ms), l.route].filter(Boolean).join(' · ');
}
// Matemática em LaTeX (o ChatGPT escreve \(30 \times 1\)) vira texto legível, sem biblioteca (ensaio da M0.8d).
const TEX = { times: '×', div: '÷', cdot: '·', approx: '≈', leq: '≤', le: '≤', geq: '≥', ge: '≥', neq: '≠', to: '→', rightarrow: '→', pm: '±', infty: '∞' };
function delatex(s) {
  if (!/\\[([a-zA-Z]/.test(s)) return s;
  let o = s.replace(/\\\[\s*([\s\S]*?)\s*\\\]/g, '$1').replace(/\\\(\s*([\s\S]*?)\s*\\\)/g, '$1');
  o = o.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '$1/$2').replace(/\\text\{([^{}]*)\}/g, '$1').replace(/\\mathbf\{([^{}]*)\}/g, '**$1**').replace(/_\{([^{}]*)\}/g, '($1)');
  return o.replace(/\\(times|div|cdot|approx|leq|le|geq|ge|neq|to|rightarrow|pm|infty)(?![a-zA-Z])/g, (_m, k) => TEX[k]);
}
// Motivo de parada em frase (antes aparecia o código, como "userStopped").
const REASONS = {
  userStopped: 'console.reason.userStopped', maxSteps: 'console.reason.maxSteps', sessionPaused: 'console.reason.sessionPaused',
  'budget.windowExhausted': 'console.reason.windowExhausted', 'provider.unavailable': 'console.reason.providerUnavailable',
  'effect.unknown': 'console.reason.effectUnknown', needsReconciliation: 'console.reason.needsReconciliation', internalError: 'console.reason.internalError',
};
// </puras>
// Negrito e código em linha, montados como nós de texto: nada do modelo vira HTML.
function inline(text) {
  const f = document.createDocumentFragment();
  // O LaTeX sai do texto corrido, nunca de dentro do código.
  const plain = String(text).split(/(`[^`\n]+`)/).map((x) => (/^`[^`]+`$/.test(x) ? x : delatex(x))).join('');
  for (const part of plain.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/)) {
    if (/^\*\*[^*]+\*\*$/.test(part)) f.append(el('strong', {}, part.slice(2, -2)));
    else if (/^`[^`]+`$/.test(part)) f.append(el('code', {}, part.slice(1, -1)));
    else if (part) f.append(document.createTextNode(part));
  }
  return f;
}
function rich(text) {
  const f = document.createDocumentFragment();
  for (const b of mdBlocks(text)) {
    if (b.type === 'code') f.append(el('pre', { class: 'code' }, el('code', {}, b.text)));
    else if (b.type === 'list') f.append(el(b.ordered ? 'ol' : 'ul', {}, ...b.items.map((i) => el('li', {}, inline(i)))));
    else if (b.type === 'h') f.append(el('p', { class: 'h' }, el('strong', {}, inline(b.text))));
    else f.append(el('p', {}, inline(b.text)));
  }
  return f;
}
async function api(method, params) {
  const r = await fetch('/api/' + method, { method: 'POST', headers: { 'content-type': 'application/json', 'x-rbuddy-token': token }, body: JSON.stringify(params || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  return j.result;
}
function conn(ok) { $('conn').className = 'dot ' + (ok ? 'ok' : 'bad'); $('connText').textContent = t(ok ? 'console.conn.ok' : 'console.conn.lost'); }

async function loadLang() {
  const r = await fetch('/i18n/' + lang + '.json', { headers: { 'x-rbuddy-token': token } });
  cat = await r.json();
  document.documentElement.lang = lang;
  $('lang').value = lang;
  for (const e of document.querySelectorAll('[data-i18n]')) e.textContent = t(e.getAttribute('data-i18n'));
  for (const e of document.querySelectorAll('[data-i18n-placeholder]')) e.setAttribute('placeholder', t(e.getAttribute('data-i18n-placeholder')));
  for (const e of document.querySelectorAll('[data-i18n-aria]')) e.setAttribute('aria-label', t(e.getAttribute('data-i18n-aria')));
  $('budgetToggle').textContent = t(showAll ? 'console.budget.some' : 'console.budget.all');
}

// Uma linha por evento (o mesmo catálogo do rbuddy log); a conversa vira balões.
// Raciocínio, comandos, resultados e passos ficam num grupo recolhível entre as falas (rev. 6, critério 32);
// aberto ou fechado pela preferência do usuário, e o que ele abrir ou fechar à mão é respeitado.
function feedItems(evs) {
  const out = [];
  const routes = {};
  let grp = null;
  let n = 0;
  const group = () => {
    if (!grp) {
      const key = 'g' + (n++);
      const open = groupOpen.has(key) ? groupOpen.get(key) : prefs.details;
      const inner = el('div', { class: 'in' });
      const d = el('details', { class: 'grp', 'data-key': key }, el('summary', {}), inner);
      d.open = open;
      d.addEventListener('toggle', () => groupOpen.set(key, d.open));
      grp = { d, inner, count: 0 };
      out.push(d);
    }
    return grp;
  };
  const detail = (node) => { const g = group(); g.inner.append(node); g.count++; g.d.firstChild.textContent = t('console.feed.details', { n: g.count }); };
  const speak = (node) => { grp = null; out.push(node); };
  for (const e of evs) {
    const p = e.payload || {};
    switch (e.kind) {
      case 'agent.message': {
        if (p.prior) break; // histórico copiado da execução anterior (já está na tela)
        const m = p.message || {};
        if (m.role === 'user') speak(el('div', { class: 'bubble you' }, el('span', { class: 'who' }, t('console.feed.you'), p.steer ? el('span', { class: 'tag' }, t('console.feed.steered')) : null), m.content));
        else if (m.role === 'assistant') {
          if (m.content && !(m.toolCalls || []).length) speak(el('div', { class: 'bubble buddy' }, el('span', { class: 'who' }, t('console.feed.buddy')), rich(m.content)));
          else if (m.content) detail(el('div', { class: 'ev' }, rich(m.content)));
          for (const c of m.toolCalls || []) detail(el('div', { class: 'ev tool' }, t('console.feed.tool') + ': ' + c.name + ' ' + String(c.arguments || '').slice(0, 160)));
        } else if (m.role === 'tool') detail(el('details', { class: 'res' }, el('summary', {}, t('console.feed.result')), el('pre', {}, String(m.content || '').slice(0, 4000))));
        break;
      }
      case 'agent.reasoning': detail(el('details', { class: 'res reason', open: '' }, el('summary', {}, t('console.feed.reasoning')), el('pre', {}, String(p.text || '')))); break;
      case 'run.stopped': speak(el('div', { class: 'ev err' }, t('log.runStopped', { run: p.run, reason: REASONS[p.reason] ? t(REASONS[p.reason]) : p.reason }))); break;
      case 'run.interrupted': speak(el('div', { class: 'ev err' }, t('log.runInterrupted', { run: p.run }))); break;
      case 'run.resumed': detail(el('div', { class: 'ev' }, t('log.runResumed', { run: p.run }))); break;
      case 'agent.step': detail(el('div', { class: 'ev' }, t('log.step', { step: p.step, route: p.route, input: (p.usage || {}).input_tokens || 0, output: (p.usage || {}).output_tokens || 0 }) + (p.effort ? ' · ' + t('console.effort.' + p.effort) : ''))); break;
      case 'budget.reserved': routes[p.reservation] = p.provider + '/' + p.model; break;
      case 'budget.settled': detail(el('div', { class: 'ev' }, t('log.settled', { amount: Number(p.actual || 0).toFixed(4), route: routes[p.reservation] || '?' }))); break;
      case 'provider.error': speak(el('div', { class: 'ev err' }, t('log.providerError', { route: p.route, code: p.code, message: p.message }))); break;
      case 'provider.switched': detail(el('div', { class: 'ev' }, t('log.switched', { from: p.from, to: p.to, reason: p.reason }))); break;
      case 'effort.dropped': speak(el('div', { class: 'ev err' }, t('log.effortDropped', { route: p.route, effort: p.effort, code: p.code }))); break;
      case 'approval.requested': detail(el('div', { class: 'ev' }, t('log.approvalRequested', { action: p.action }))); break;
      case 'approval.resolved': detail(el('div', { class: 'ev' }, t('log.approvalResolved', { decision: t(p.decision === 'approve' ? 'log.approved' : 'log.denied') }))); break;
      case 'file.written': detail(el('div', { class: 'ev' }, t('log.fileWritten', { path: p.path }))); break;
      case 'command.ran': detail(el('div', { class: 'ev' }, t('log.commandRan', { command: p.command, code: p.code }))); break;
      case 'effect.unknown': speak(el('div', { class: 'ev err' }, t('log.effectUnknown', { effect: p.effect }))); break;
      case 'effect.reconciled': detail(el('div', { class: 'ev' }, t('log.reconciled', { effect: p.effect, outcome: p.outcome }))); break;
      case 'context.compacted': detail(el('div', { class: 'ev' }, t('log.compacted', { before: p.before, after: p.after }))); break;
      default: break;
    }
  }
  return out;
}

let lastFeedKey = '';

// ---------- Andamento ao vivo (rev. 6, critério 31) ----------
// Fase, tempo, raciocínio e texto chegando em cadência; a fila com Direcionar e Cancelar; Parar.
const liveEl = el('div', { class: 'live' });
let liveState = null;     // última resposta de run.live
let shown = 0;            // caracteres do texto ao vivo já revelados
let liveRun = null;
let reasonOpen = null;    // aberto à mão no raciocínio ao vivo
async function refreshLive() {
  if (!session) { liveState = null; renderLive(); return; }
  const l = await api('run.live', { session });
  if (l.running && l.running.run !== liveRun) { liveRun = l.running.run; shown = 0; reasonOpen = null; }
  if (l.running && liveState && liveState.running && l.running.callStartedAt !== liveState.running.callStartedAt) shown = 0;
  const was = Boolean(liveState && liveState.running);
  liveState = l;
  $('stop').hidden = !l.running;
  if (!(l.queue || []).length && $('runMsg').textContent === t('console.queue.queued')) $('runMsg').textContent = '';
  if (was && !l.running) { lastFeedKey = ''; void refreshFeed(); }
  renderLive();
}
function renderLive() {
  const l = liveState;
  const kids = [];
  if (l && l.running) {
    const r = l.running;
    kids.push(el('div', { class: 'line', role: 'status' }, el('span', { class: 'spin', 'aria-hidden': 'true' }), el('span', { id: 'liveLine' }, liveLine(r, Date.now() - Date.parse(r.callStartedAt), t))));
    if (r.reasoning) {
      const d = el('details', { class: 'grp reason' }, el('summary', {}, t('console.feed.reasoning')), el('pre', { id: 'liveReason' }, r.reasoning));
      d.open = reasonOpen === null ? prefs.details : reasonOpen;
      d.addEventListener('toggle', () => { reasonOpen = d.open; });
      kids.push(d);
    }
    if (r.text) kids.push(el('div', { class: 'bubble buddy typing', id: 'liveText' }, el('span', { class: 'who' }, t('console.feed.buddy')), el('span', { id: 'liveTextBody' }, r.text.slice(0, shown))));
  }
  for (const q of (l && l.queue) || []) {
    kids.push(el('div', { class: 'queued' }, el('span', { class: 'who' }, t('console.queue.title')), q.task,
      el('div', { class: 'actions' },
        el('button', { class: 'primary', onclick: () => steer(q.id) }, t('console.queue.steer')),
        el('button', { onclick: () => unqueue(q.id) }, t('console.queue.cancel')))));
  }
  const feed = $('feed');
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  liveEl.replaceChildren(...kids);
  if (session && !liveEl.isConnected) feed.append(liveEl);
  if (atBottom) feed.scrollTop = feed.scrollHeight;
}
// Quadro a quadro: o relógio corre e o texto se revela em cadência, sem refazer a conversa.
let lastFrame = performance.now();
function frame(now) {
  const dt = now - lastFrame;
  lastFrame = now;
  const r = liveState && liveState.running;
  if (r) {
    const line = $('liveLine');
    if (line) line.textContent = liveLine(r, Date.now() - Date.parse(r.callStartedAt), t);
    const body = $('liveTextBody');
    if (body && shown < r.text.length) {
      shown = revealStep(shown, r.text.length, dt);
      body.textContent = r.text.slice(0, shown);
      const feed = $('feed');
      if (feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80) feed.scrollTop = feed.scrollHeight;
    }
    const reason = $('liveReason');
    if (reason && reason.textContent !== r.reasoning) {
      const follow = reason.scrollHeight - reason.scrollTop - reason.clientHeight < 40;
      reason.textContent = r.reasoning;
      if (follow) reason.scrollTop = reason.scrollHeight;
    }
  }
  requestAnimationFrame(frame);
}
async function steer(id) { try { await api('agent.steer', { session, queue: id }); } catch (e) { $('runMsg').className = 'msg bad'; $('runMsg').textContent = t('console.error', { message: e.message }); } void refreshLive(); }
async function unqueue(id) { try { await api('agent.unqueue', { session, queue: id }); } catch { /* já saiu da fila */ } void refreshLive(); }
async function refreshFeed() {
  const feed = $('feed');
  if (!session) { if (lastFeedKey !== 'empty') { feed.replaceChildren(el('div', { class: 'note' }, t('console.feed.empty'))); lastFeedKey = 'empty'; } $('sessionLabel').textContent = ''; return; }
  const evs = await api('session.events', { session });
  const key = session + ':' + evs.length + ':' + lang;
  $('sessionLabel').textContent = '· ' + t('console.feed.session', { session });
  if (key === lastFeedKey) return;
  lastFeedKey = key;
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  const items = feedItems(evs);
  const runs = evs.filter((e) => e.kind === 'run.started').map((e) => e.payload.run);
  lastRun = runs[runs.length - 1] || null;
  feed.replaceChildren(...items, liveEl);
  if (atBottom) feed.scrollTop = feed.scrollHeight;
}

async function refreshApprovals() {
  const list = await api('approval.list');
  const box = $('approvals');
  if (!list.length) { box.replaceChildren(el('div', { class: 'note' }, t('console.approvals.none'))); return; }
  box.replaceChildren(...list.map((a) => el('div', { class: 'approval' },
    el('div', { class: 'a' }, a.action),
    el('div', { class: 'note' }, a.session),
    el('div', { class: 'actions' },
      el('button', { class: 'primary', onclick: () => resolve(a.id, 'approve') }, t('console.approvals.approve')),
      el('button', { class: 'danger', onclick: () => resolve(a.id, 'deny') }, t('console.approvals.deny'))))));
}
async function resolve(id, decision) { try { await api('approval.resolve', { id, decision }); } catch (e) { /* já resolvida */ } await refreshApprovals(); }

function sourceText(s) {
  if (!s) return '';
  if (s.kind === 'env') return t('providers.source.env', { name: s.name });
  return t(s.kind === 'keys' ? 'providers.source.keys' : 'providers.source.login');
}
async function refreshProviders() {
  providerState = await api('providers.status');
  $('providers').replaceChildren(...providerState.map((p, i) => el('li', {},
    el('span', { class: 't' }, (i + 1) + '. ' + p.provider + '/' + p.model),
    el('span', { class: 'badge ' + (p.source ? 'ok' : 'warn'), title: sourceText(p.source) }, p.source ? sourceText(p.source) : t('console.route.missing')))));
  const sel = $('route');
  // Primeira montagem: o provedor escolhido da última vez (critério 34).
  const cur = sel.options.length ? sel.value : prefs.route;
  const opts = [el('option', { value: '' }, t('console.route.auto'))];
  for (const r of routesCfg) {
    const ready = providerState.find((p) => p.provider === r.provider)?.source;
    opts.push(el('option', { value: JSON.stringify(r) }, r.provider + ' · ' + r.model + ' (' + t(ready ? 'console.route.ready' : 'console.route.missing') + ')'));
  }
  sel.replaceChildren(...opts);
  sel.value = [...sel.options].some((o) => o.value === cur) ? cur : '';
}
async function refreshAuth() {
  const v = authView(await api('auth.chatgpt.status'), t);
  $('chatgptState').textContent = v.text;
  $('login').textContent = t(v.loginKey);
  $('login').className = v.loginPrimary ? 'primary' : '';
  $('logout').disabled = !v.logoutEnabled;
}
async function refreshBudget() {
  const ws = await api('budget.status');
  const shown = showAll ? ws : ws.filter((w) => w.used > 0 || w.exhaustedUntil || w.provider !== 'opencode-go');
  $('budget').replaceChildren(...shown.map((w) => {
    const pct = w.capacity ? Math.min(100, (w.used / w.capacity) * 100) : 0;
    const right = w.exhaustedUntil ? t('console.budget.exhausted', { until: new Date(w.exhaustedUntil).toLocaleString(lang) }) : w.capacity === null ? 'US$ ' + w.used.toFixed(4) + ' · ' + t('console.budget.noCap') : 'US$ ' + w.used.toFixed(4) + ' / ' + w.capacity.toFixed(2);
    return el('div', { class: 'win' }, el('div', { class: 'n' }, el('span', {}, w.id), el('span', { class: 'note' }, right)), w.capacity ? el('div', { class: 'bar' }, el('i', { style: 'width:' + pct.toFixed(1) + '%' })) : null);
  }));
}
async function refreshRuns() {
  const runs = (await api('run.list')).slice(-15).reverse();
  if (!runs.length) { $('runs').replaceChildren(el('li', { class: 'note' }, t('console.runs.none'))); return; }
  $('runs').replaceChildren(...runs.map((r) => {
    const canResume = r.state === 'interrupted' || r.state === 'stopped';
    return el('li', { class: r.session === session ? 'sel' : '', onclick: () => openSession(r.session) },
      el('span', { class: 't', title: r.task }, r.task.slice(0, 60)),
      el('span', { class: 'badge ' + (r.state === 'done' ? 'ok' : r.state === 'running' ? '' : 'warn') }, t('status.state.' + r.state)),
      canResume ? el('button', { onclick: (ev) => { ev.stopPropagation(); resume(r); } }, t('console.runs.resume')) : null);
  }));
}
function openSession(s) { session = s; store.set('rb.session', s); lastFeedKey = ''; liveState = null; liveEl.replaceChildren(); void refreshFeed(); void refreshLive(); void refreshRuns(); }
$('newChat').addEventListener('click', () => { session = null; store.set('rb.session', ''); liveState = null; liveEl.replaceChildren(); $('stop').hidden = true; lastRun = null; lastFeedKey = ''; $('runMsg').textContent = ''; void refreshFeed(); void refreshRuns(); $('task').focus(); });
$('task').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $('run').click(); } });
async function resume(r) {
  try { await api('agent.resume', { run: r.id, workspace: $('workspace').value, interactive: true }); openSession(r.session); }
  catch (e) { $('runMsg').className = 'msg bad'; $('runMsg').textContent = t('console.error', { message: e.message }); }
}

$('run').addEventListener('click', async () => {
  const task = $('task').value.trim();
  const msg = $('runMsg');
  msg.className = 'msg';
  if (!task) { msg.className = 'msg bad'; msg.textContent = t('console.task.empty'); return; }
  const cont = Boolean(session && lastRun);
  const s = cont ? session : 'ses-' + [...crypto.getRandomValues(new Uint8Array(4))].map((b) => b.toString(16).padStart(2, '0')).join('');
  const params = { session: s, task, workspace: $('workspace').value, interactive: true, effort: $('effort').value };
  if ($('route').value) params.route = JSON.parse($('route').value);
  if (cont) params.continueFrom = lastRun;
  $('run').disabled = true;
  try {
    const r = await api('agent.run', params);
    store.set('rb.workspace', $('workspace').value);
    store.set('rb.effort', $('effort').value);
    store.set('rb.route', $('route').value);
    $('task').value = '';
    // Conversa ocupada: a mensagem entrou na fila (Direcionar agora ou Cancelar, logo abaixo da conversa).
    msg.textContent = r.queued ? t('console.queue.queued') : '';
    $('task').focus();
    if (r.queued) void refreshLive(); else openSession(s);
  } catch (e) { msg.className = 'msg bad'; msg.textContent = t('console.error', { message: e.message }); }
  finally { $('run').disabled = false; }
});
$('stop').addEventListener('click', async () => {
  try { await api('agent.stop', { session }); } catch (e) { /* já terminou */ }
  void refreshLive();
});
function applyTheme(choice) {
  const v = themeOf(choice);
  if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
}
$('theme').addEventListener('change', () => { prefs.theme = $('theme').value; store.set('rb.theme', prefs.theme); applyTheme(prefs.theme); });
$('detailsToggle').addEventListener('change', () => {
  prefs.details = $('detailsToggle').checked;
  store.set('rb.details', prefs.details ? 'open' : 'closed');
  groupOpen.clear();
  for (const d of document.querySelectorAll('#feed details.grp')) d.open = prefs.details;
  reasonOpen = null;
});
$('login').addEventListener('click', async () => {
  // A janela abre no clique (senão o bloqueador de pop-up barra) e recebe a URL quando o núcleo responder.
  const w = window.open('about:blank', '_blank');
  $('loginMsg').className = 'msg';
  $('loginMsg').textContent = '';
  try {
    const { url } = await api('auth.chatgpt.start');
    if (w) w.location.href = url; else { $('loginMsg').className = 'msg bad'; $('loginMsg').textContent = t('console.chatgpt.popup'); }
  } catch (e) { if (w) w.close(); $('loginMsg').className = 'msg bad'; $('loginMsg').textContent = t('console.error', { message: e.message }); }
  void refreshAuth();
});
$('logout').addEventListener('click', async () => { try { await api('auth.chatgpt.logout'); } catch (e) { /* nada */ } void refreshAuth(); void refreshProviders(); });
$('keySave').addEventListener('click', async () => {
  const m = $('keyMsg');
  try { await api('keys.set', { provider: $('keyProvider').value, key: $('keyValue').value }); $('keyValue').value = ''; m.className = 'msg'; m.textContent = t('console.keys.saved'); }
  catch (e) { m.className = 'msg bad'; m.textContent = t('console.error', { message: e.message }); }
  void refreshProviders();
});
$('keyRemove').addEventListener('click', async () => {
  const m = $('keyMsg');
  try { await api('keys.remove', { provider: $('keyProvider').value }); m.className = 'msg'; m.textContent = t('console.keys.removed'); }
  catch (e) { m.className = 'msg bad'; m.textContent = t('console.error', { message: e.message }); }
  void refreshProviders();
});
$('budgetToggle').addEventListener('click', () => { showAll = !showAll; $('budgetToggle').textContent = t(showAll ? 'console.budget.some' : 'console.budget.all'); void refreshBudget(); });
$('lang').addEventListener('change', async () => { lang = $('lang').value; store.set('rb.lang', lang); await loadLang(); lastFeedKey = ''; void slow(); void fast(); });

async function fast() { try { await Promise.all([refreshFeed(), refreshApprovals()]); conn(true); } catch { conn(false); } }
async function liveTick() { try { await refreshLive(); } catch { /* a conexão é cuidada pelo fast */ } }
async function slow() { try { await Promise.all([refreshProviders(), refreshAuth(), refreshBudget(), refreshRuns()]); conn(true); } catch { conn(false); } }

(async () => {
  await loadLang();
  try {
    const d = await api('console.defaults');
    routesCfg = d.routes;
    $('workspace').value = store.get('rb.workspace', d.workspace);
    $('effort').value = store.get('rb.effort', 'default');
  } catch { conn(false); }
  $('detailsToggle').checked = prefs.details;
  $('theme').value = themeOf(prefs.theme) ?? 'system';
  applyTheme(prefs.theme);
  await slow();
  await fast();
  await liveTick();
  setInterval(fast, 800);
  setInterval(liveTick, 300);
  setInterval(slow, 3000);
  requestAnimationFrame(frame);
})();
</script>
</body>
