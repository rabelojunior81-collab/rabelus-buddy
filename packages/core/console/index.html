<style>
  /*

    --glass-solid: oklch(18% .025 118 / .86);

    --side: oklch(10% .02 118 / .45);
    --hair: oklch(82% .03 115 / .14);
    --hair-strong: oklch(82% .05 118 / .26);
    --hover: oklch(100% 0 0 / .05);
    --text: oklch(95% .012 110);
    --muted: oklch(76% .025 115);
    --faint: oklch(70% .025 115);
    --accent: oklch(78% .13 118);
    --olive-300: oklch(86% .11 115);
    --olive-400: oklch(76% .13 118);
    --gold: oklch(82% .12 85);
    --bad: oklch(76% .15 28);
    --warn: oklch(84% .12 85);
    --ok: oklch(80% .14 145);
    --primary-a: oklch(52% .12 121 / .95);
    --primary-b: oklch(42% .1 124 / .95);
    --primary-ink: oklch(98% .01 110);
    --mark-filter: drop-shadow(0 0 6px oklch(82% .12 85 / .35));
    --c-vision: oklch(80% .11 185); --c-reason: oklch(77% .13 300); --c-tools: oklch(80% .13 60); --c-video: oklch(77% .12 245); --c-open: oklch(83% .13 125);
    --shadow: 0 24px 80px -20px oklch(4% .02 120 / .75);
    --ease: cubic-bezier(.2, .7, .2, 1);
    color-scheme: dark;
  }
  /* Tema (critério 35): Sistema segue o navegador; Claro e Escuro escolhidos na console valem acima dele. Os dois

      --gold: oklch(45% .1 75);
      --bad: oklch(45% .17 28);
      --warn: oklch(45% .1 75);
      --ok: oklch(42% .12 145);
      --primary-a: oklch(50% .12 121);

  :root[data-theme="light"] {
    --bg: oklch(95% .025 118);

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; color: var(--text); font: 13px/1.5 var(--font); -webkit-font-smoothing: antialiased; background-color: var(--bg);
    background-image: radial-gradient(70rem 42rem at 8% -6%, var(--glow-a), transparent 62%), radial-gradient(52rem 34rem at 92% 4%, var(--glow-b), transparent 60%),
      radial-gradient(60rem 40rem at 70% 112%, var(--glow-c), transparent 62%), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: auto, auto, auto, 48px 48px, 48px 48px; }
  textarea, input, select, button { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 1.5px solid var(--olive-400); outline-offset: 2px; }
  /* liquid glass: preenchimento translúcido, desfoque saturado, borda fina e brilho especular em cima */
  .glass { position: relative; background: var(--glass-fill), var(--glass-tint); backdrop-filter: blur(22px) saturate(1.7); -webkit-backdrop-filter: blur(22px) saturate(1.7);
    border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 oklch(100% 0 0 / .14), inset 0 -1px 0 oklch(0% 0 0 / .18), var(--shadow); }
  .glass::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--glass-spec); opacity: .55; }
  .glass > * { position: relative; }
  .app { display: grid; grid-template-columns: 212px minmax(0, 1fr); height: 100%; height: 100dvh; }
  /* barra lateral */
  .side { display: flex; flex-direction: column; gap: 6px; padding: 12px 10px; border-right: 1px solid var(--hair); background: var(--side); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); min-height: 0; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 4px; font-size: 15px; font-weight: 700; letter-spacing: -.035em; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .mark { width: 28px; height: 28px; margin: -2px 0; flex: none; filter: var(--mark-filter); }
  .new { height: 32px; border: 1px solid oklch(80% .12 118 / .35); background: linear-gradient(135deg, var(--primary-a), var(--primary-b)); color: var(--primary-ink); font-size: 13px; font-weight: 650;
    box-shadow: inset 0 1px 0 oklch(100% 0 0 / .2), 0 8px 24px -10px oklch(55% .12 120 / .7); transition: filter .2s var(--ease), transform .2s var(--ease); }
  .new:hover { filter: brightness(1.08); } .new:active { transform: translateY(1px); }
  .sect { margin: 10px 6px 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .day { margin: 6px 8px 0; font-size: 11px; color: var(--faint); }
  .thread { display: block; width: 100%; padding: 6px 8px; border: 0; border-left: 2px solid transparent; background: none; text-align: left; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); transition: background .18s var(--ease), color .18s var(--ease); }
  .thread:hover { background: var(--hover); color: var(--text); }
  .thread.sel { color: var(--text); border-left-color: var(--olive-400); background: var(--hover); }
  .thread .st { margin-right: 6px; color: var(--accent); }
  .agents { display: flex; flex-direction: column; }
  .agent { display: flex; align-items: center; gap: 9px; padding: 5px 8px; font-size: 12.5px; color: var(--muted); }
  .agent .st { margin-left: auto; width: 6px; height: 6px; background: var(--olive-400); box-shadow: 0 0 8px var(--olive-400); }
  /* Ícone de harness (SVG preto do registro): máscara na cor do texto, visível nos dois temas (achado do ensaio). */
  .ico { display: inline-block; width: 16px; height: 16px; flex: none; background: currentColor; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .ico.box { background: none; -webkit-mask: none; mask: none; border: 1.4px solid currentColor; }
  img.mark.ico { background: none; -webkit-mask: none; mask: none; filter: var(--mark-filter); }
  .side .foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; border-top: 1px solid var(--hair); font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; display: inline-block; background: var(--faint); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .dot.bad { background: var(--bad); }
  /* área principal */
  main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; flex: none; }
  .top .sp { flex: 1; }
  .ibtn { min-width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0 6px; border: 1px solid var(--hair); background: oklch(100% 0 0 / .03); font-size: 13px; color: var(--muted); transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease); }
  .ibtn:hover { color: var(--text); border-color: var(--hair-strong); background: oklch(100% 0 0 / .07); }
  .mbrand { display: none; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .toggle input { margin: 0; accent-color: var(--olive-400); }
  .note { color: var(--muted); font-size: 12.5px; }
  #feed { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px max(16px, calc((100% - 760px) / 2)) 16px; }
  /* início */
  #home { display: flex; flex-direction: column; }
  .eyebrow { align-self: flex-start; margin-top: 12vh; padding: 4px 9px; border: 1px solid oklch(82% .12 85 / .4); background: linear-gradient(135deg, oklch(82% .12 85 / .14), oklch(76% .13 118 / .06)); color: var(--gold); font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  h1 { font-size: 26px; line-height: 1.1; font-weight: 700; letter-spacing: -.045em; margin: 10px 0 12px; color: var(--text); }
  .starters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .starter { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--hair); background: oklch(100% 0 0 / .03); font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .sugg { display: block; width: 100%; padding: 9px 10px; border: 0; border-top: 1px solid var(--hair); background: none; text-align: left; font-size: 13.5px; color: var(--muted); transition: color .18s var(--ease), background .18s var(--ease), padding-left .18s var(--ease); }
  .sugg:hover { color: var(--text); background: var(--hover); padding-left: 14px; }
  /* conversa */
  .bubble { padding: 7px 10px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--hair); }
  .bubble.you { align-self: flex-end; max-width: 85%; background: oklch(100% 0 0 / .045); }
  .bubble.buddy { max-width: 100%; background: color-mix(in oklch, var(--accent) 7%, transparent); border-color: color-mix(in oklch, var(--accent) 28%, transparent); }
  .bubble p { margin: 0 0 8px; } .bubble p.h { margin-top: 10px; font-size: 1.04em; } .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child, .bubble pre:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 22px; white-space: normal; }
  /* Tabela, citação e linha horizontal da resposta (missão B1): tabela com rolagem, bordas finas, cabeçalho discreto. */
  .tbl { overflow-x: auto; margin: 6px 0; }
  .tbl table { border-collapse: collapse; font-size: 12.5px; }
  .tbl th, .tbl td { border: 1px solid var(--hair); padding: 4px 8px; text-align: left; vertical-align: top; }
  .tbl th { color: var(--muted); font-weight: 600; }
  .bubble blockquote { margin: 6px 0; padding-left: 10px; border-left: 2px solid var(--olive-400); color: var(--muted); }
  .bubble hr { border: 0; border-top: 1px solid var(--hair); margin: 8px 0; }
  .bubble .tbl:last-child, .bubble blockquote:last-child { margin-bottom: 0; }
  /* Código: tom oliva translúcido, leve nos dois temas (no claro, o cinza escuro pesava; achado do ensaio). */
  .bubble pre.code { margin: 0 0 8px; padding: 8px 10px; background: oklch(50% .03 118 / .12); border: 1px solid var(--hair); overflow: auto; white-space: pre; }
  .bubble pre.code code { padding: 0; background: none; }
  .bubble code, code { font-family: var(--mono); font-size: 12.5px; background: oklch(50% .03 118 / .12); padding: 1px 5px; }  .who { display: block; font-size: 10.5px; color: var(--faint); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .1em; }
  .ev { font-size: 12.5px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--hair); }
  .ev.err { color: var(--bad); border-left-color: var(--bad); }
  .ev.tool { color: var(--text); }
  details.res { font-size: 12.5px; color: var(--muted); padding-left: 10px; border-left: 2px solid var(--hair); }
  details.res pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0 0; max-height: 200px; overflow: auto; }
  details.grp { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--hair); padding-left: 10px; }
  details.grp > summary { cursor: pointer; user-select: none; }
  details.grp > .in { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  details.reason pre, .live .reason pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0 0; max-height: 240px; overflow: auto; font-family: inherit; color: var(--muted); }
  .live { display: flex; flex-direction: column; gap: 8px; }
  .live .line { font-size: 12px; color: var(--accent); display: flex; gap: 8px; align-items: center; }
  .live .spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--accent); border-right-color: transparent; animation: rb-spin .8s linear infinite; }
  @keyframes rb-spin { to { transform: rotate(360deg); } }
  .bubble.buddy.typing::after { content: '▍'; color: var(--accent); }
  .queued { align-self: flex-end; max-width: 85%; border: 1px dashed var(--hair-strong); padding: 8px 10px; font-size: 13.5px; }
  .queued .who { color: var(--warn); }
  .tag { font-size: 10.5px; color: var(--warn); margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .actions { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .btn { height: 28px; padding: 0 11px; border: 1px solid var(--hair-strong); background: oklch(100% 0 0 / .04); font-size: 12.5px; font-weight: 600; transition: background .18s var(--ease); }
  .btn:hover { background: oklch(100% 0 0 / .09); }
  .btn.pri { border-color: oklch(80% .12 118 / .4); background: linear-gradient(135deg, var(--primary-a), var(--primary-b)); color: var(--primary-ink); }
  .btn.danger { border-color: color-mix(in oklch, var(--bad) 55%, transparent); color: var(--bad); background: transparent; }
  /* aprovações: cartão de vidro sobre a caixa de mensagem, sempre à vista */
  .dock { flex: none; padding: 0 max(12px, calc((100% - 784px) / 2)) 10px; }

  .perm .a { flex: 1 1 220px; min-width: 0; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

const groupOpen = new Map();  // grupos abertos ou fechados à mão pelo usuário

let showAll = false;
let providerState = [];

function t(key, vars) {
  let s = key.split('.').reduce((o, p) => (o && typeof o === 'object' ? o[p] : undefined), cat);
  if (typeof s !== 'string') return key;
  for (const [k, v] of Object.entries(vars || {})) s = s.split('{{' + k + '}}').join(String(v));

  const h = (list || []).find((x) => x.id === runHarness);
  return { kind: 'harness', id: runHarness, name: (h && h.name) || runHarness };

// Blocos da resposta: parágrafo, lista e bloco de código cercado por ```.
function mdBlocks(text) {
  const out = [];
  const lines = String(text).replace(/\r\n/g, '\n').split('\n');
  let para = [];
  const flush = () => { if (para.length) out.push({ type: 'p', text: para.join('\n') }); para = []; };
  for (let i = 0; i < lines.length; i++) {
    const fence = /^\s*```\s*([\w+-]*)\s*$/.exec(lines[i]);
    if (fence) {
      flush();
      const body = [];
      for (i++; i < lines.length && !/^\s*```\s*$/.test(lines[i]); i++) body.push(lines[i]);
      out.push({ type: 'code', lang: fence[1], text: body.join('\n') });
      continue;
    }
    const head = /^\s*#{1,6}\s+(.+?)\s*#*\s*$/.exec(lines[i]);
    if (head) {

      for (const b of out) delete b.open;

      flush();
      for (const b of out) delete b.open;
      out.push({ type: 'hr' });
      continue;
    }
    // Tabela (missão B1): linha com barras, seguida da linha separadora (- e : opcionais) com o mesmo número de colunas.
    const cells = (line) => {
      let s = line.trim();

  const all = await api('run.list');
  const runs = all.slice(-15).reverse();
  if (!runs.length) $('runs').replaceChildren(el('li', { class: 'note' }, t('console.runs.none')));
  else $('runs').replaceChildren(...runs.map((r) => {
    const canResume = r.state === 'interrupted' || r.state === 'stopped';
    return el('li', { class: r.session === session ? 'sel' : '', onclick: () => openSession(r.session) },
      el('span', { class: 't', title: r.task }, r.task.slice(0, 60)),
      el('span', { class: 'badge ' + (r.state === 'done' ? 'ok' : r.state === 'running' ? '' : 'warn') }, t('status.state.' + r.state)),
      canResume ? el('button', { class: 'btn', onclick: (ev) => { ev.stopPropagation(); resume(r); } }, t('console.runs.resume')) : null);
  }));
  // Conversas da barra lateral (M1.5a), pelo dia em que cada uma começou.
  let sessions = [];
  try { sessions = await api('session.list'); } catch { /* sem datas: tudo cai num dia só */ }
  const groups = threadsOf(all, sessions, new Date(), -new Date().getTimezoneOffset());
  const dayText = (d) => (d === 'today' ? t('console.side.today') : d === 'yesterday' ? t('console.side.yesterday') : new Date(d + 'T12:00:00').toLocaleDateString(lang));
  $('threads').replaceChildren(...(groups.length ? groups.flatMap((g) => [el('div', { class: 'day' }, dayText(g.day)),
    ...g.items.map((x) => el('button', { class: 'thread' + (x.session === session ? ' sel' : ''), title: x.title, onclick: () => { openSession(x.session); drawer(false); } },
      x.state === 'running' ? el('span', { class: 'st', 'aria-hidden': 'true' }, '●') : null, x.title))]) : [el('div', { class: 'day' }, t('console.side.none'))]));
}
// Harnesses encontrados (registro oficial do ACP e tabela própria): ícone servido pela console, sem nada de fora,
// desenhado como máscara na cor do texto; sem ícone, um quadrado.
const harnessIcon = (h) => (h.icon ? el('span', { class: 'ico', 'aria-hidden': 'true', style: "--src:url('" + asset('/icons/harness/' + h.id + '.svg') + "')" }) : el('span', { class: 'ico box', 'aria-hidden': 'true' }));
async function refreshAgents() {
  const r = await api('harness.list');
  harnesses = r.harnesses.filter((h) => h.found);
  lastFeedKey = ''; // a conversa refaz os nomes dos harnesses (achado do ensaio: aparecia o id)
  $('agents').replaceChildren(...(harnesses.length ? harnesses.map((h) => el('div', { class: 'agent', title: h.description || h.name },
    harnessIcon(h), h.name, el('span', { class: 'st', title: t('console.side.installed') }))) : [el('div', { class: 'day' }, t('console.side.noAgents'))]));
  renderHome();
  renderHarnessPill();
}
// A tela inicial sai do documento quando há conversa aberta: atualizada pela referência guardada, nunca por id.
// As pílulas escolhem quem executa (M1.5b).
function renderHome() {
  homeEl.querySelector('#homeEyebrow').textContent = t('console.home.eyebrow', { n: harnesses.length });
  const pill = (id, icon, name) => el('button', { class: 'starter', 'aria-pressed': String(chosen === id), onclick: () => chooseHarness(id) }, icon, name);
  homeEl.querySelector('#starters').replaceChildren(pill('buddy', buddyMark(), 'Buddy'), ...harnesses.map((h) => pill(h.id, harnessIcon(h), h.name)));
}

// ---------- Harness na caixa (M1.5b): quem executa ----------
// "buddy" é o agente do próprio Rabelus Buddy; os outros, harnesses ACP encontrados. A sonda roda só ao escolher
// (cada uma inicia um processo), e o resultado aparece na pílula.
let chosen = store.get('rb.harness', 'buddy') || 'buddy';
const probes = {};
const buddyMark = () => el('img', { class: 'ico mark', alt: '', src: asset('/brand/emblema-64.png') });
function renderHarnessPill() {
  const h = harnesses.find((x) => x.id === chosen);
  const pr = h && probes[h.id];
  const v = pr ? probeView(pr) : null;
  $('hBtn').replaceChildren(...[h ? harnessIcon(h) : buddyMark(), el('span', { class: 'nm' }, h ? h.name : 'Buddy'),
    v && el('span', { class: 'state ' + v.tone }, t(v.key)), el('span', { class: 'chev', 'aria-hidden': 'true' }, '▾')].filter(Boolean));
  // Harness usa os próprios modelos e esforço: as pílulas de modelo e esforço são do Buddy.
  $('mBtn').hidden = Boolean(h);
  $('task').setAttribute('placeholder', h ? t('console.harness.placeholder', { name: h.name }) : t('console.task.placeholder'));
  renderModelPill();
}
function renderHarnessList() {
  const row = (id, icon, name, desc, pr) => {
    const v = pr ? probeView(pr) : null;
    return el('button', { class: 'mrow', role: 'option', 'aria-selected': String(chosen === id), onclick: () => { chooseHarness(id); hPop(false); } },
      icon, el('span', { class: 'tx' }, el('b', {}, name), el('small', {}, desc)), v ? el('span', { class: 'state ' + v.tone }, t(v.key)) : null);
  };
  // Negada a primeira execução, o Pai pode rever a decisão (A1): pede um pedido de aprovação novo.
  const review = (id) => el('button', { class: 'mrow', onclick: () => { hPop(false); reviewHarness(id); } }, el('span', { class: 'tx' }, el('b', {}, t('console.harness.firstRun.review'))));
  $('hList').replaceChildren(row('buddy', buddyMark(), 'Buddy', t('console.harness.buddyDesc'), null),
    ...harnesses.flatMap((h) => [row(h.id, harnessIcon(h), h.name, (probes[h.id] && probes[h.id].reason) || h.description || '', probes[h.id]),
      ...(probes[h.id] && probes[h.id].state === 'negado' ? [review(h.id)] : [])]));
}
// Rever a negação da primeira execução (A1): o núcleo refaz o pedido; a sonda e a lista de aprovações mostram o estado novo.
async function reviewHarness(hid) {
  try {
    await api('harness.firstRun.reset', { id: hid });
    approvalNote = t('console.harness.firstRun.reviewed');
    probes[hid] = await api('harness.probe', { id: hid });
  } catch (e) { approvalNote = e.message; }
  renderHarnessPill();
  if (!$('hPop').hidden) renderHarnessList();
  await refreshApprovals();
}
// Lista ancorada no botão (no celular, folha embaixo); um clique fora, Esc ou a escolha fecham.
function hPop(open) {
  const pop = $('hPop');
  pop.hidden = !open;
  $('hBtn').setAttribute('aria-expanded', String(open));
  if (!open) return;
  renderHarnessList();
  const r = $('hBtn').getBoundingClientRect();
  pop.style.bottom = (innerHeight - r.top + 8) + 'px';
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px';
  const first = pop.querySelector('[aria-selected="true"]') || pop.querySelector('.mrow');
  if (first) first.focus();
}
async function chooseHarness(id) {
  chosen = harnesses.some((h) => h.id === id) ? id : 'buddy';
  store.set('rb.harness', chosen);
  renderHarnessPill();
  renderHome();
  if (chosen === 'buddy') return;
  const hid = chosen;
  probes[hid] = { state: 'checking' };
  renderHarnessPill();
  try { probes[hid] = await api('harness.probe', { id: hid }); }
  catch (e) { probes[hid] = { state: 'falhou', reason: e.message }; }
  renderHarnessPill();
  if (!$('hPop').hidden) renderHarnessList();
  void refreshApprovals(); // primeira execução pendente aparece já como aprovação
}
// Entrar (M1.2e): o núcleo pede ao harness que faça o login; ele abre o navegador e guarda a própria credencial.
async function loginHarness(id, method) {
  const name = harnessName(id);
  approvalNote = t('console.harness.loginRunning', { name });
  await refreshApprovals();
  const DONE = { pronto: 'console.harness.loginDone.pronto', login: 'console.harness.loginDone.login', falhou: 'console.harness.loginDone.falhou' };
  try {
    const r = await api('harness.login', { id, method });
    probes[id] = r;
    approvalNote = t(DONE[r.state] || DONE.falhou, { name, reason: r.reason || '' });
  } catch (e) { approvalNote = t(DONE.falhou, { name, reason: e.message }); }
  renderHarnessPill();
  await refreshApprovals();
}
$('hBtn').addEventListener('click', () => hPop($('hPop').hidden));
document.addEventListener('mousedown', (ev) => { if (!$('hPop').hidden && !$('hPop').contains(ev.target) && !$('hBtn').contains(ev.target)) hPop(false); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$('hPop').hidden) { ev.stopPropagation(); hPop(false); $('hBtn').focus(); } }, true);
// ---------- Anexos na caixa (M1.3b) ----------
// Cada anexo sobe na hora pelo núcleo (attachment.put) e fica como chip; a conversa nova ganha uma sessão de rascunho
// no primeiro anexo, para os anexos e a tarefa irem para a mesma conversa. Trocar de conversa limpa os anexos.
let pending = [];
let draft = null;
const newSessionId = () => 'ses-' + [...crypto.getRandomValues(new Uint8Array(4))].map((b) => b.toString(16).padStart(2, '0')).join('');
function sendSession() { if (session && lastRun) return session; draft = draft || newSessionId(); return draft; }
function clearAttachments() { pending = []; draft = null; renderChips(); }
function renderChips() {
  $('chips').replaceChildren(...pending.map((a, i) => el('span', { class: 'chip', title: a.mime + ' · ' + Math.ceil(a.size / 1024) + ' KB' }, a.kind === 'image' ? '🖼' : '📄', el('span', { class: 'nm' }, a.name),
    el('button', { class: 'chipx', 'aria-label': t('console.attach.remove', { name: a.name }), onclick: () => { pending.splice(i, 1); renderChips(); } }, '✕'))));
}
const attachNote = (text) => { $('runMsg').className = 'msg bad'; $('runMsg').textContent = text; };
const toBase64 = (file) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(r.error); r.readAsDataURL(file); });
async function addFiles(files) {
  for (const f of files) {
    const mime = attachMime(f.name, f.type);
    if (!mime) { attachNote(t('console.attach.badType', { name: f.name })); continue; }
    const image = mime.startsWith('image/');
    if (image && !canAttachImage({ harness: chosen, model: pickedModel(), probe: probes[chosen] || null })) { attachNote(t('console.attach.noVision', { name: f.name })); continue; }
    const max = image ? 5 : 1;
    if (f.size > max * 1024 * 1024) { attachNote(t('console.attach.tooBig', { name: f.name, max })); continue; }
    try {
      const a = await api('attachment.put', { session: sendSession(), workspace: $('workspace').value, name: f.name, mime, data: await toBase64(f) });
      pending.push(a);
      renderChips();
      $('runMsg').textContent = '';
    } catch (e) { attachNote(t('console.error', { message: e.message })); }
  }
}
$('aBtn').addEventListener('click', () => $('aFile').click());
$('aFile').addEventListener('change', () => { void addFiles([...$('aFile').files]); $('aFile').value = ''; });
const composer = document.querySelector('.composer');
composer.addEventListener('dragover', (ev) => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) { ev.preventDefault(); composer.classList.add('drop'); } });
composer.addEventListener('dragleave', () => composer.classList.remove('drop'));
composer.addEventListener('drop', (ev) => { composer.classList.remove('drop'); if (!ev.dataTransfer || !ev.dataTransfer.files.length) return; ev.preventDefault(); void addFiles([...ev.dataTransfer.files]); });
$('task').addEventListener('paste', (ev) => { const fs = ev.clipboardData ? [...ev.clipboardData.files] : []; if (!fs.length) return; ev.preventDefault(); void addFiles(fs); });

function openSession(s) { if (s !== session) clearAttachments(); session = s; store.set('rb.session', s); lastFeedKey = ''; liveState = null; liveEl.replaceChildren(); void refreshFeed(); void refreshLive(); void refreshRuns(); void refreshApprovals(); }
$('newChat').addEventListener('click', () => { clearAttachments(); session = null; store.set('rb.session', ''); liveState = null; liveEl.replaceChildren(); $('stop').hidden = true; lastRun = null; lastFeedKey = ''; $('runMsg').textContent = ''; void refreshFeed(); void refreshRuns(); drawer(false); $('task').focus(); });
$('task').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $('run').click(); } });
for (const b of document.querySelectorAll('.sugg')) b.addEventListener('click', () => { $('task').value = b.textContent; $('task').focus(); });
async function resume(r) {
  try { await api('agent.resume', { run: r.id, workspace: $('workspace').value, interactive: true }); openSession(r.session); }
  catch (e) { $('runMsg').className = 'msg bad'; $('runMsg').textContent = t('console.error', { message: e.message }); }
}

$('run').addEventListener('click', async () => {
  const task = $('task').value.trim();
  const msg = $('runMsg');
  msg.className = 'msg';
  if (!task) { msg.className = 'msg bad'; msg.textContent = t('console.task.empty'); return; }
  const cont = Boolean(session && lastRun);
  const s = sendSession();
  const params = { session: s, task, workspace: $('workspace').value, interactive: true };
  // Anexos já guardados na conversa (M1.3b): vão pelos hashes.
  if (pending.length) params.attachments = pending.map((a) => a.hash);
  // Harness escolhido (M1.5b): a tarefa vai a ele, com os modelos e o esforço dele; senão, o Buddy com os provedores.
  if (chosen !== 'buddy') params.harness = chosen;
  else {
    params.effort = $('effort').value;
    if (picked) params.route = picked;
  }
  if (cont) params.continueFrom = lastRun;
  // Idioma da console (Pai, 2026-10-20: camada de inglês sob o app inteiro): o Buddy fala nele.
  params.lang = lang;
  $('run').disabled = true;
  try {
    const r = await api('agent.run', params);
    store.set('rb.workspace', $('workspace').value);
    store.set('rb.effort', $('effort').value);
    $('task').value = '';
    clearAttachments();
    // Conversa ocupada: a mensagem entrou na fila (Direcionar agora ou Cancelar, logo abaixo da conversa).
    msg.textContent = r.queued ? t('console.queue.queued') : '';
    $('task').focus();
    if (r.queued) void refreshLive(); else openSession(s);
  } catch (e) { msg.className = 'msg bad'; msg.textContent = t('console.error', { message: e.message }); }
  finally { $('run').disabled = false; }
});
$('stop').addEventListener('click', async () => {
  try { await api('agent.stop', { session }); } catch (e) { /* já terminou */ }
  void refreshLive();
});
function applyTheme(choice) {
  const v = themeOf(choice);
  if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
}
// Ajustes (painel) e gaveta do celular: um por vez, Esc fecha, o foco volta a quem abriu.
function settingsOpen(open) {
  $('settings').hidden = !open;
  $('settingsBtn').setAttribute('aria-expanded', String(open));
  $('scrim').hidden = !open && !$('side').classList.contains('open');
  if (open) $('settingsClose').focus(); else $('settingsBtn').focus();
}
function drawer(open) {
  if (!open && !$('side').classList.contains('open')) return;
  $('side').classList.toggle('open', open);
  $('menuBtn').setAttribute('aria-expanded', String(open));
  $('scrim').hidden = !open && $('settings').hidden;
}
$('settingsBtn').addEventListener('click', () => settingsOpen($('settings').hidden));
$('settingsClose').addEventListener('click', () => settingsOpen(false));
$('menuBtn').addEventListener('click', () => drawer(!$('side').classList.contains('open')));
$('scrim').addEventListener('click', () => { if (!$('settings').hidden) settingsOpen(false); drawer(false); });
document.addEventListener('keydown', (ev) => { if (ev.key !== 'Escape') return; if (!$('settings').hidden) settingsOpen(false); else drawer(false); });
$('theme').addEventListener('change', () => { prefs.theme = $('theme').value; store.set('rb.theme', prefs.theme); applyTheme(prefs.theme); });
$('detailsToggle').addEventListener('change', () => {
  prefs.details = $('detailsToggle').checked;
  store.set('rb.details', prefs.details ? 'open' : 'closed');
  groupOpen.clear();
  for (const d of document.querySelectorAll('#feed details.grp')) d.open = prefs.details;
  reasonOpen = null;
});
$('login').addEventListener('click', async () => {
  // A janela abre no clique (senão o bloqueador de pop-up barra) e recebe a URL quando o núcleo responder.
  const w = window.open('about:blank', '_blank');
  $('loginMsg').className = 'msg note';
  $('loginMsg').textContent = '';
  try {
    const { url } = await api('auth.chatgpt.start');
    if (w) w.location.href = url; else { $('loginMsg').className = 'msg bad'; $('loginMsg').textContent = t('console.chatgpt.popup'); }
  } catch (e) { if (w) w.close(); $('loginMsg').className = 'msg bad'; $('loginMsg').textContent = t('console.error', { message: e.message }); }
  void refreshAuth();
});
$('logout').addEventListener('click', async () => { try { await api('auth.chatgpt.logout'); } catch (e) { /* nada */ } void refreshAuth(); void refreshProviders(); });
$('keySave').addEventListener('click', async () => {
  const m = $('keyMsg');
  try { await api('keys.set', { provider: $('keyProvider').value, key: $('keyValue').value }); $('keyValue').value = ''; m.className = 'msg note'; m.textContent = t('console.keys.saved'); }
  catch (e) { m.className = 'msg bad'; m.textContent = t('console.error', { message: e.message }); }
  void refreshProviders();
});
$('keyRemove').addEventListener('click', async () => {
  const m = $('keyMsg');
  try { await api('keys.remove', { provider: $('keyProvider').value }); m.className = 'msg note'; m.textContent = t('console.keys.removed'); }
  catch (e) { m.className = 'msg bad'; m.textContent = t('console.error', { message: e.message }); }
  void refreshProviders();
});
$('budgetToggle').addEventListener('click', () => { showAll = !showAll; $('budgetToggle').textContent = t(showAll ? 'console.budget.some' : 'console.budget.all'); void refreshBudget(); });
$('lang').addEventListener('change', async () => { lang = $('lang').value; store.set('rb.lang', lang); await loadLang(); lastFeedKey = ''; void slow(); void fast(); });
$('workspace').addEventListener('change', () => store.set('rb.workspace', $('workspace').value));

async function fast() { try { await Promise.all([refreshFeed(), refreshApprovals()]); conn(true); } catch { conn(false); } }
async function liveTick() { try { await refreshLive(); } catch { /* a conexão é cuidada pelo fast */ } }
async function slow() { try { await Promise.all([refreshProviders(), refreshAuth(), refreshBudget(), refreshRuns()]); conn(true); } catch { conn(false); } }

(async () => {
  // Marca do Rabelus Lab (pedido do Pai, 2026-10-18), servida pela própria console.
  $('brandMark').src = asset('/brand/emblema-256.png');
  $('brandMarkM').src = asset('/brand/emblema-256.png');
  $('favicon').href = asset('/brand/emblema-64.png');
  await loadLang();
  try {
    const d = await api('console.defaults');
    $('workspace').value = store.get('rb.workspace', d.workspace);
  } catch { conn(false); }
  $('detailsToggle').checked = prefs.details;
  $('theme').value = themeOf(prefs.theme) ?? 'system';
  applyTheme(prefs.theme);
  await slow();
  await fast();
  await liveTick();
  try { await refreshAgents(); } catch { /* sem registro ainda: a lista fica vazia */ }
  // Harness lembrado da última vez: conferido de novo ao abrir (uma sonda só).
  if (chosen !== 'buddy') void chooseHarness(chosen);
  // Catálogo de modelos em segundo plano: a pílula mostra o nome e as capacidades do modelo lembrado.
  void loadCatalog().then(renderModelPill, () => { /* sem catálogo: a pílula mostra o id */ });
  setInterval(fast, 800);
  setInterval(liveTick, 300);
  setInterval(slow, 3000);
  setInterval(() => { void refreshAgents().catch(() => {}); }, 60_000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
