<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabelus Buddy — protótipo visual do M1</title>
<!--
  Protótipo ESTÁTICO da SPEC 0002 (M1), para o Pai aprovar a direção visual antes do código.
  Não fala com o núcleo. Ergonomia relida do t3.chat; paleta rosa/roxo trocada por verde-oliva e derivados;
  glassmorphism. Ícones dos agentes: registro oficial do ACP (CDN), pintados por máscara (seguem o tema).
-->
<style>
  :root {
    /* Verde-oliva em OKLCH (matiz ~118–125), escuro como padrão. */
    --tint-bg: oklch(16% .028 118);         /* fundo tingido atrás de tudo */
    --side: oklch(14% .022 118 / .72);      /* barra lateral, vidro */
    --sheet: oklch(20.5% .022 118 / .78);   /* folha da conversa, vidro */
    --glass: oklch(30% .03 120 / .35);      /* pílulas de vidro */
    --glass-strong: oklch(26% .03 120 / .7);
    --line: oklch(40% .04 118 / .35);
    --text: oklch(96% .012 110);
    --muted: oklch(74% .03 115);
    --olive-300: oklch(84% .1 118);
    --olive-400: oklch(74% .13 120);
    --olive-500: oklch(63% .13 122);
    --olive-600: oklch(52% .115 123);
    --olive-700: oklch(43% .1 124);
    --olive-800: oklch(35% .08 125);
    --primary-from: var(--olive-600);
    --primary-to: var(--olive-800);
    --primary-ink: oklch(98% .01 110);
    --reflect: linear-gradient(180deg, oklch(63% .13 122 / 0), oklch(63% .13 122 / .75), oklch(63% .13 122 / .1)), linear-gradient(15deg, oklch(63% .13 122 / .12) 50%, oklch(63% .13 122 / .7));
    --r: .5rem; --r-xl: .75rem; --r-2xl: 1rem;
    --blur-md: 12px; --blur-xl: 24px;
    --picker-bg: oklch(17.5% .026 118); /* vidro aninhado não desfoca a página: fundo quase opaco */
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --tint-bg: oklch(93.5% .035 115);
    --side: oklch(95% .03 115 / .7);
    --sheet: oklch(98.6% .012 110 / .82);
    --glass: oklch(100% 0 0 / .45);
    --glass-strong: oklch(100% 0 0 / .75);
    --line: oklch(70% .05 118 / .35);
    --text: oklch(24% .035 122);
    --muted: oklch(45% .04 120);
    --primary-from: oklch(55% .12 122);
    --primary-to: oklch(44% .1 124);
    --reflect: linear-gradient(180deg, oklch(80% .1 118 / 0), oklch(70% .12 120 / .8), oklch(80% .1 118 / .2)), linear-gradient(15deg, oklch(80% .1 118 / .2) 50%, oklch(66% .12 121 / .7));
    --picker-bg: oklch(98.4% .012 110);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden; color: var(--text);
    font: 15px/1.55 "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(60rem 40rem at 85% -10%, oklch(52% .115 123 / .35), transparent 60%),
      radial-gradient(50rem 35rem at -10% 110%, oklch(43% .1 124 / .4), transparent 60%),
      var(--tint-bg);
  }
  .app { display: grid; grid-template-columns: 264px 1fr; height: 100vh; }
  /* ---------- barra lateral ---------- */
  aside { padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; background: var(--side); backdrop-filter: blur(var(--blur-xl)); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; padding: 4px 6px; }
  .brand b { font-size: 19px; letter-spacing: .2px; }
  .brand b span { color: var(--olive-400); }
  :root[data-theme="light"] .brand b span { color: var(--olive-700); }
  .btn-primary { position: relative; height: 38px; border: 0; border-radius: var(--r); color: var(--primary-ink); font-weight: 650; cursor: pointer;
    background: linear-gradient(180deg, var(--primary-from), var(--primary-to)); box-shadow: 0 1px 0 oklch(100% 0 0 / .12) inset, 0 6px 18px -8px var(--olive-700); }
  .search { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13.5px; }
  .group { font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 6px 6px 2px; }
  .thread { padding: 7px 10px; border-radius: var(--r); font-size: 14px; color: var(--text); opacity: .9; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread.sel { background: var(--glass); backdrop-filter: blur(var(--blur-md)); opacity: 1; }
  .agents { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
  .agent { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: var(--r); font-size: 13.5px; }
  .agent:hover { background: var(--glass); }
  .agent .st { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--olive-400); box-shadow: 0 0 0 3px oklch(74% .13 120 / .2); }
  .agent .st.off { background: var(--muted); box-shadow: none; opacity: .5; }
  .ico { width: 18px; height: 18px; flex: none; background: currentColor; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .ico.buddy { -webkit-mask: none; mask: none; background: radial-gradient(circle at 35% 35%, var(--olive-300), var(--olive-600)); border-radius: 50%; }
  /* ---------- folha da conversa ---------- */
  main { position: relative; margin: 12px 12px 0 0; border-radius: var(--r-2xl) var(--r-2xl) 0 0; background: var(--sheet); backdrop-filter: blur(var(--blur-xl));
    border: 1px solid var(--line); border-bottom: 0; display: flex; flex-direction: column; overflow: hidden; }
  .top { position: absolute; top: 10px; right: 12px; display: flex; gap: 6px; z-index: 2; }
  .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--r); border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(var(--blur-md)); color: var(--text); cursor: pointer; }
  .scroll { flex: 1; overflow: auto; padding: 56px 0 24px; }
  .col { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  h1 { font-size: 30px; margin: 64px 0 18px; letter-spacing: -.3px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(var(--blur-xl));
    color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .pill.on { background: linear-gradient(180deg, var(--primary-from), var(--primary-to)); color: var(--primary-ink); border-color: transparent; }
  .sugg { border-top: 1px solid var(--line); padding: 11px 10px; color: var(--muted); font-size: 15px; cursor: pointer; border-radius: var(--r); }
  .sugg:hover { background: var(--glass); color: var(--text); }
  /* conversa */
  .msg-you { margin: 18px 0 18px auto; max-width: 78%; padding: 10px 14px; border-radius: var(--r-xl); background: var(--glass-strong); border: 1px solid var(--line); backdrop-filter: blur(var(--blur-md)); width: fit-content; }
  .attach { display: flex; gap: 8px; margin-top: 8px; }
  .thumb { width: 64px; height: 48px; border-radius: 8px; border: 1px solid var(--line); background: linear-gradient(135deg, oklch(63% .13 122), oklch(35% .08 125)); }
  .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin: 6px 0; }
  .details { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; color: var(--muted); font-size: 13px; margin: 8px 0; }
  .details summary { cursor: pointer; }
  .perm { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-xl); border: 1px solid oklch(74% .13 120 / .45); background: oklch(52% .115 123 / .14); backdrop-filter: blur(var(--blur-md)); margin: 10px 0; font-size: 13.5px; }
  .perm code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .perm .sp { flex: 1; }
  .btn-ghost { height: 30px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--glass); color: var(--text); cursor: pointer; font-weight: 600; }
  .btn-sm { height: 30px; padding: 0 12px; border-radius: var(--r); border: 0; color: var(--primary-ink); font-weight: 650; background: linear-gradient(180deg, var(--primary-from), var(--primary-to)); cursor: pointer; }
  .answer { line-height: 1.65; }
  .live { display: flex; align-items: center; gap: 8px; color: var(--olive-400); font-size: 13px; margin-top: 10px; }
  :root[data-theme="light"] .live { color: var(--olive-700); }
  .spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  /* ---------- caixa de mensagem ---------- */
  .dock { padding: 0 24px 0; }
  .composer { position: relative; max-width: 760px; margin: 0 auto; padding: 8px; border-radius: var(--r-2xl) var(--r-2xl) 0 0; background: var(--glass); backdrop-filter: blur(var(--blur-xl)); }
  .composer::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--reflect); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  .box { border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--sheet); border: 1px solid var(--line); border-bottom: 0; padding: 12px 12px 10px; }
  .box textarea { width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; min-height: 48px; }
  .box textarea::placeholder { color: var(--muted); }
  .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bar .pill { height: 32px; padding: 0 11px; font-size: 12.5px; }
  .send { margin-left: auto; width: 36px; height: 36px; border-radius: var(--r); border: 0; color: var(--primary-ink); background: linear-gradient(180deg, var(--primary-from), var(--primary-to)); cursor: pointer; display: grid; place-items: center; }
  .proto { position: fixed; left: 280px; bottom: 6px; font-size: 11px; color: var(--muted); }
  /* ---------- seletores: harness (menu) e modelo (paleta central) ---------- */
  button.pill { font: inherit; font-size: 13px; font-weight: 600; }
  .pill[disabled] { opacity: .45; cursor: not-allowed; }
  .menu { position: fixed; width: 380px; max-height: 60vh; overflow: auto; padding: 6px; border-radius: var(--r-2xl); background: var(--picker-bg); border: 1px solid var(--line); box-shadow: 0 24px 60px -24px oklch(10% .02 120 / .7); z-index: 6; }
  .mi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: var(--r-xl); background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .mi:hover, .mi:focus-visible { background: var(--glass); outline: none; }
  .mi .ico { width: 22px; height: 22px; }
  .mi .tx { flex: 1; min-width: 0; }
  .mi .tx b { display: block; font-size: 14.5px; }
  .mi .tx small { display: block; color: var(--muted); font-size: 12.5px; }
  .mi .ok { color: var(--olive-400); font-weight: 700; }
  :root[data-theme="light"] .mi .ok { color: var(--olive-700); }
  .mi[aria-disabled="true"] { opacity: .5; cursor: default; }
  .backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: oklch(10% .02 120 / .45); backdrop-filter: blur(6px); }
  .backdrop[hidden] { display: none; }
  .palette { width: min(860px, 100%); height: min(640px, 86vh); display: flex; flex-direction: column; border-radius: 18px; background: var(--picker-bg); border: 1px solid var(--line); box-shadow: 0 40px 100px -30px oklch(5% .02 120 / .8); overflow: hidden; }
  .pl-top { display: flex; gap: 8px; padding: 14px 14px 8px; }
  .pl-top input { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); color: var(--text); padding: 0 14px; font: inherit; font-size: 15.5px; }
  .pl-top input:focus { outline: 2px solid var(--olive-500); outline-offset: 1px; }
  .pl-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; border-bottom: 1px solid var(--line); }
  .fchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--text); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .fchip[aria-pressed="true"] { background: linear-gradient(180deg, var(--primary-from), var(--primary-to)); color: var(--primary-ink); border-color: transparent; }
  .pl-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 200px 1fr; }
  .pl-tabs { border-right: 1px solid var(--line); padding: 8px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  .tab { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 10px; border: 0; border-radius: 10px; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .tab b { font-size: 14px; }
  .tab small { font-size: 11.5px; color: var(--muted); }
  .tab:hover { background: var(--glass); }
  .tab[aria-selected="true"] { background: var(--glass-strong); box-shadow: inset 3px 0 0 var(--olive-500); }
  .pl-list { overflow: auto; padding: 6px 10px 12px; scroll-padding: 40px; }
  .grp-h { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: 10px 6px 6px; font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); background: var(--picker-bg); z-index: 1; }
  .grp-h .lab { width: 16px; height: 16px; color: var(--text); }
  .row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 4px 12px; width: 100%; padding: 10px 10px; border: 0; border-radius: 12px; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .row:hover, .row.act { background: var(--glass); }
  .row.sel { box-shadow: inset 0 0 0 1.5px var(--olive-500); }
  .row .nm { font-size: 14.5px; font-weight: 600; }
  .row .id { grid-column: 2; font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .row .rt { grid-row: 1 / span 2; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .row .ck { grid-row: 1 / span 2; color: var(--olive-400); font-weight: 800; }
  .icons { display: flex; gap: 6px; color: var(--muted); }
  .icons .on { color: var(--text); }
  .meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .badge2 { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .pl-foot { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .kbd { font-family: ui-monospace, Consolas, monospace; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); }
  .lab { width: 16px; height: 16px; flex: none; background: currentColor; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .lab-fb { width: 16px; height: 16px; flex: none; display: grid; place-items: center; font-size: 9px; font-weight: 800; border-radius: 4px; border: 1px solid currentColor; }
  .cap { width: 15px; height: 15px; flex: none; }
  .pl-list { overflow-x: hidden; }
  @media (max-width: 760px) {
    .backdrop { padding: 8px; }
    .palette { height: 92vh; border-radius: 14px; }
    .pl-filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .fchip { flex: none; }
    .pl-tabs { scrollbar-width: none; }
    .row { grid-template-columns: 22px 1fr; }
    .row .rt { grid-row: auto; grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: 8px; }
    .pl-foot .kbd, .pl-foot span:not(:last-child) { display: none; }
  }
  @media (max-width: 760px) { .pl-body { grid-template-columns: 1fr; } .pl-tabs { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } .tab { flex: none; } .menu { width: calc(100% - 16px); } }
  /* capacidades sob a caixa de mensagem */
  .caps { display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
  .capchip { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); color: var(--text); }
  .capchip.no { opacity: .4; text-decoration: line-through; }
  .caps .src { margin-left: auto; flex: none; font-size: 11.5px; cursor: help; white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-att { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: var(--r); background: var(--glass); border: 1px solid var(--line); font-size: 12px; margin-bottom: 6px; }
  .toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); padding: 8px 14px; border-radius: var(--r-xl); background: var(--glass-strong); backdrop-filter: blur(var(--blur-md)); border: 1px solid var(--line); font-size: 13px; z-index: 9; }
  @media (max-width: 860px) { .pk-cols { grid-template-columns: 1fr; height: 60vh; } }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } aside { display: none; } main { margin: 8px 8px 0; } .proto { left: 12px; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="ico buddy"></span><b>Rabelus <span>Buddy</span></b></div>
    <button class="btn-primary">Nova conversa</button>
    <div class="search">⌕ Buscar conversas…</div>
    <div class="group">Hoje</div>
    <div class="thread sel">Revisar o README com o Codex</div>
    <div class="thread">Primos entre 100 e 220</div>
    <div class="thread">Problema dos trens</div>
    <div class="group">Agentes encontrados · 7</div>
    <div class="agents" id="agents"></div>
  </aside>
  <main>
    <div class="top">
      <button class="icon-btn" id="view" title="Alternar início/conversa">⇄</button>
      <button class="icon-btn" id="theme" title="Tema">◐</button>
      <button class="icon-btn" title="Configurações">⚙</button>
    </div>
    <div class="scroll"><div class="col" id="content"></div></div>
    <div class="dock"><div class="composer">
      <div class="box">
      <div class="chips" id="chips"></div>
      <textarea id="task" placeholder="Escreva para o Buddy… (anexe imagens e arquivos)"></textarea>
      <div class="bar">
        <button class="pill" id="harnessBtn" aria-haspopup="listbox" title="Harness: quem executa"></button>
        <button class="pill" id="pickBtn" aria-haspopup="dialog" title="Modelo: com que cérebro"></button>
        <button class="pill" id="effortBtn" title="Esforço de raciocínio (clique para trocar)"></button>
        <button class="pill" id="attachBtn">📎 Anexar</button>
        <button class="pill" id="imgBtn">🖼 Imagem</button>
        <button class="send" id="send" title="Enviar">↑</button>
      </div>
      <div class="caps" id="caps" aria-label="Capacidades do modelo escolhido"></div>
    </div></div></div>
  </main>
</div>
<div class="menu" id="hmenu" role="listbox" aria-label="Harness" hidden></div>
<div class="backdrop" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Escolher modelo">
    <div class="pl-top">
      <input id="plSearch" placeholder="Buscar modelo ou lab…" autocomplete="off" aria-label="Buscar modelo">
      <button class="icon-btn" id="plClose" title="Fechar (Esc)">✕</button>
    </div>
    <div class="pl-filters" id="plFilters"></div>
    <div class="pl-body">
      <nav class="pl-tabs" id="plTabs" aria-label="Provedor ou roteador"></nav>
      <div class="pl-list" id="plList" role="listbox"></div>
    </div>
    <div class="pl-foot" id="plFoot"></div>
  </div>
</div>
<div class="proto">Protótipo da SPEC 0002 — interativo, mas sem ligação com o núcleo · catálogo medido ao vivo em <span id="snapDate"></span></div>
<script src="prototipo-visual.js"></script>
</body>
</html>
